[project]
name = "datos-dep"
version = "0.1.0"
description = "Utilidades de datos deportivos"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pypdf>=7.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
